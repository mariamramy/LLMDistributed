x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-env
    LLM_PROVIDER: ollama
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-llama3.2:3b-instruct-q3_K_M}
    OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-all-minilm}
    OLLAMA_EMBED_MAX_CHARS: ${OLLAMA_EMBED_MAX_CHARS:-200}
    OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-300}
    CHROMA_HOST: chromadb
    CHROMA_PORT: "8000"
    CHROMA_COLLECTION: ${CHROMA_COLLECTION:-distributed_systems_textbook_ollama_all_minilm}
    RAG_TOP_K: ${RAG_TOP_K:-3}
    RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
    RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-75}
    WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-2}
    HEARTBEAT_INTERVAL_S: ${HEARTBEAT_INTERVAL_S:-5}
    MASTER_URL: ${MASTER_URL:-http://scheduler:9000}
  networks:
    - llmnet

services:

  scheduler:
    <<: *app
    command: ["python", "-m", "master.scheduler"]
    ports:
      - "9000:9000"

  load_balancer:
    <<: *app
    command: ["python", "-m", "lb.load_balancer"]
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      LB_FORWARD_TIMEOUT_S: "250"
    depends_on:
      scheduler:
        condition: service_started

  chromadb:
    image: chromadb/chroma:1.5.3
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/localhost/8000; printf \"GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - llmnet

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - llmnet

  ollama_pull:
    image: ollama/ollama
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull "$$OLLAMA_GENERATION_MODEL"
        ollama pull "$$OLLAMA_EMBEDDING_MODEL"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-llama3.2:3b-instruct-q3_K_M}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-all-minilm}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - llmnet

  rag_ingest:
    <<: *app
    restart: "no"
    command: ["python", "-m", "rag.ingest", "--once"]
    environment:
      <<: *app-env
      PDF_CORPUS_DIR: /app/pdfs
      RAG_INGEST_BATCH_SIZE: ${RAG_INGEST_BATCH_SIZE:-16}
    volumes:
      - ./pdfs:/app/pdfs:ro
    depends_on:
      chromadb:
        condition: service_healthy
      ollama_pull:
        condition: service_completed_successfully

  worker-1:
    <<: *app
    command: ["python", "-m", "workers.gpu_workers"]
    ports:
      - "9101:9100"
    environment:
      <<: *app-env
      WORKER_ID: worker-1
      WORKER_PORT: "9100"
      WORKER_ADVERTISE_HOST: worker-1
      STUB_MODE: ${STUB_MODE:-false}
      STUB_DELAY_MS: ${STUB_DELAY_MS:-50}
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      rag_ingest:
        condition: service_completed_successfully

  worker-2:
    <<: *app
    command: ["python", "-m", "workers.gpu_workers"]
    ports:
      - "9102:9100"
    environment:
      <<: *app-env
      WORKER_ID: worker-2
      WORKER_PORT: "9100"
      WORKER_ADVERTISE_HOST: worker-2
      STUB_MODE: ${STUB_MODE:-false}
      STUB_DELAY_MS: ${STUB_DELAY_MS:-50}
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      rag_ingest:
        condition: service_completed_successfully

  worker-3:
    <<: *app
    command: ["python", "-m", "workers.gpu_workers"]
    ports:
      - "9103:9100"
    environment:
      <<: *app-env
      WORKER_ID: worker-3
      WORKER_PORT: "9100"
      WORKER_ADVERTISE_HOST: worker-3
      STUB_MODE: ${STUB_MODE:-false}
      STUB_DELAY_MS: ${STUB_DELAY_MS:-50}
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      rag_ingest:
        condition: service_completed_successfully

  worker-4:
    <<: *app
    command: ["python", "-m", "workers.gpu_workers"]
    ports:
      - "9104:9100"
    environment:
      <<: *app-env
      WORKER_ID: worker-4
      WORKER_PORT: "9100"
      WORKER_ADVERTISE_HOST: worker-4
      OLLAMA_BASE_URL: https://q1miw9kq-11434.thundercompute.net
      OLLAMA_SSL_VERIFY: "false"
      WORKER_MAX_CONCURRENCY: "4"
    depends_on:
      chromadb:
        condition: service_healthy
      rag_ingest:
        condition: service_completed_successfully

  worker-5:
    <<: *app
    command: ["python", "-m", "workers.gpu_workers"]
    ports:
      - "9105:9100"
    environment:
      <<: *app-env
      WORKER_ID: worker-5
      WORKER_PORT: "9100"
      WORKER_ADVERTISE_HOST: worker-5
      OLLAMA_BASE_URL: https://q1miw9kq-11434.thundercompute.net
      OLLAMA_SSL_VERIFY: "false"
      WORKER_MAX_CONCURRENCY: "4"
    depends_on:
      chromadb:
        condition: service_healthy
      rag_ingest:
        condition: service_completed_successfully

networks:
  llmnet:

volumes:
  chroma-data:
  ollama-data: